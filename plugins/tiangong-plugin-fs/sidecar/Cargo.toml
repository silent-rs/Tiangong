[package]
name = "tiangong-plugin-fs-sidecar"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Fs 独立 sidecar 进程（承载文件读写、进程级锁表、路径解析与沙箱策略）"
publish = false

[[bin]]
name = "tiangong-fs-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-fs-protocol = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
tiangong-toolkit = { workspace = true }
tiangong-types = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "time", "io-util", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono = { workspace = true }
scru128 = { workspace = true }
diffy = { workspace = true }
# read_image：按文件头解码常见位图、等比缩放并重新编码为模型可接受的格式。
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[dev-dependencies]
tempfile = { workspace = true }
