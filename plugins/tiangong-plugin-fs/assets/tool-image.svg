  <circle cx="20" cy="40.5" r="1.9" fill="#0284C7"/>
  <circle cx="25.5" cy="40.5" r="1.9" fill="#38BDF8" fill-opacity="0.75"/>
  <circle cx="31" cy="40.5" r="1.9" fill="#BAE6FD" fill-opacity="0.55"/>
