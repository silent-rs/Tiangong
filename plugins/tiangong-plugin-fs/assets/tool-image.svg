<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="frame" x1="7" y1="8" x2="41" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="photo" x1="12" y1="16" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <radialGradient id="sun" cx="18" cy="20" r="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="sheen" cx="14" cy="12" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 画框 -->
  <rect x="7" y="8" width="34" height="28" rx="4.5" fill="url(#frame)"/>
  <rect x="7" y="8" width="34" height="28" rx="4.5" fill="url(#sheen)"/>
  <!-- 画面：山与日 -->
  <path d="M12.5 32.5l7.8-11.5 4.2 6.2 2.8-3.8 7.2 9.1a1.8 1.8 0 0 1-1.4 2.9H14a1.9 1.9 0 0 1-1.5-2.9z" fill="url(#photo)"/>
  <circle cx="18" cy="19.5" r="3.2" fill="url(#sun)"/>
  <!-- 山体高光棱线 -->
  <path d="M20.3 21l-1.6 2.4 1.3 1.9" stroke="#BAE6FD" stroke-opacity="0.7" stroke-width="1.1" stroke-linecap="round"/>
