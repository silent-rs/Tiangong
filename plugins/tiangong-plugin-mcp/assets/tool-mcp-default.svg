<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="plug" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="core" cx="24" cy="24" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#6366F1"/>
    </radialGradient>
    <radialGradient id="glow" cx="24" cy="24" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="24" cy="24" r="18" fill="url(#glow)"/>
  <!-- 中央插头本体 -->
  <circle cx="24" cy="24" r="8.6" fill="url(#plug)"/>
  <circle cx="24" cy="24" r="5" fill="url(#core)"/>
  <!-- 插脚（四向，喻多 server 连接） -->
  <rect x="21.9" y="6" width="4.2" height="10" rx="2.1" fill="url(#node)"/>
  <rect x="21.9" y="32" width="4.2" height="10" rx="2.1" fill="url(#node)"/>
  <rect x="6" y="21.9" width="10" height="4.2" rx="2.1" fill="url(#node)"/>
  <rect x="32" y="21.9" width="10" height="4.2" rx="2.1" fill="url(#node)"/>
  <!-- 端子光点 -->
  <circle cx="24" cy="9.5" r="2.2" fill="#EEF2FF"/>
  <circle cx="24" cy="38.5" r="2.2" fill="#EEF2FF"/>
  <circle cx="9.5" cy="24" r="2.2" fill="#EEF2FF"/>
  <circle cx="38.5" cy="24" r="2.2" fill="#EEF2FF"/>
  <!-- 中心高光 -->
  <ellipse cx="21" cy="21" rx="2.8" ry="1.7" fill="#FFFFFF" fill-opacity="0.7" transform="rotate(-35 21 21)"/>
</svg>
