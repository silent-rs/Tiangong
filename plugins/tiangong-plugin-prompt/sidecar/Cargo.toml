[package]
name = "tiangong-plugin-prompt-sidecar"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Prompt 独立 sidecar 进程（自定义指令读写、迁移与动态 prompt 段落）"
publish = false

[[bin]]
name = "tiangong-prompt-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-prompt-protocol = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "sync", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
