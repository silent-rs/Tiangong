  </defs>
  <!-- 迷你终端窗 -->
  <rect x="8" y="9" width="26" height="21" rx="4.5" fill="url(#win)"/>
  <rect x="10.5" y="14" width="21" height="13.5" rx="2.8" fill="url(#screen)"/>
