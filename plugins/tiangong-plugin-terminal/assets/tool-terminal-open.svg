  <path d="M14 18.5l3.4 2.8-3.4 2.8" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 24.2h6.5" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  <!-- 新开加号徽章 -->
  <circle cx="35" cy="35" r="9.5" fill="#047857" fill-opacity="0.2"/>
