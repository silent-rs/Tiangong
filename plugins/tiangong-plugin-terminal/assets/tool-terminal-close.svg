<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="win" x1="8" y1="10" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.5" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="screen" x1="10.5" y1="15" x2="37.5" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C2E"/>
    </linearGradient>
    <radialGradient id="badge" cx="35" cy="35" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCA5A5"/>
      <stop offset="0.5" stop-color="#F87171"/>
      <stop offset="1" stop-color="#DC2626"/>
    </radialGradient>
    <radialGradient id="cathode" cx="13" cy="17" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 迷你终端窗（灰阶示关闭态） -->
  <rect x="8" y="9" width="26" height="21" rx="4.5" fill="url(#win)"/>
  <rect x="10.5" y="14" width="21" height="13.5" rx="2.8" fill="url(#screen)"/>
  <rect x="10.5" y="14" width="21" height="13.5" rx="2.8" fill="url(#cathode)"/>
  <circle cx="13.6" cy="11.5" r="1.1" fill="#64748B"/>
  <circle cx="17" cy="11.5" r="1.1" fill="#64748B"/>
  <!-- 窗内熄灭光标（进程结束） -->
  <path d="M14 21h9" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <!-- 关闭徽章 -->
  <circle cx="35" cy="35" r="9.5" fill="#7F1D1D" fill-opacity="0.2"/>
  <circle cx="35" cy="35" r="7.5" fill="url(#badge)"/>
  <path d="M32.2 32.2l5.6 5.6M37.8 32.2l-5.6 5.6" stroke="#FEF2F2" stroke-width="2.6" stroke-linecap="round"/>
  <ellipse cx="32.4" cy="32.2" rx="2.6" ry="1.5" fill="#FFFFFF" fill-opacity="0.45" transform="rotate(-32 32.4 32.2)"/>
</svg>
