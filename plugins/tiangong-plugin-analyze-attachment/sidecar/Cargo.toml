[package]
name = "tiangong-plugin-analyze-attachment-sidecar"
version = "0.1.7"
edition = "2024"
license = "Apache-2.0"
description = "Analyze-Attachment 独立 sidecar（读取模型配置、构造多模态请求、调用 LLM）"
publish = false

[[bin]]
name = "tiangong-analyze-attachment-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-analyze-attachment-protocol = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
tiangong-core = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-config = { workspace = true }
tiangong-types = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
scru128 = { workspace = true }
