  <circle cx="27" cy="25" r="11" stroke="url(#lens)" stroke-width="4" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="27" cy="25" r="11" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <path d="M35 33l6.5 6.5" stroke="url(#handle)" stroke-width="4.6" stroke-linecap="round"/>
  <!-- 镜内高光 -->
