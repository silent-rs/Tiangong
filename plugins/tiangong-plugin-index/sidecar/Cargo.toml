[package]
name = "tiangong-plugin-index-sidecar"
version = "0.2.7"
edition = "2024"
license = "Apache-2.0"
description = "Index 独立 sidecar 进程（承载 tantivy 索引、后台扫描、rg/grep 检索原生运行）"
publish = false

[[bin]]
name = "tiangong-index-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-index-protocol = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
tiangong-toolkit = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "time", "io-util", "net", "sync"] }
libc = { workspace = true }
tantivy = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
scru128 = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
