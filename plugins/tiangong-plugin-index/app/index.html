<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>索引管理</title>
  <style>/* 索引管理设置页样式。
 *
 * 与 memory.css 同一套宿主 token 体系（--host-*），保证插件页面与宿主设置页
 * 视觉一致：按钮、输入、徽章、空态、加载态均对齐主程序原版 React 页面。
 */

:root {
  color-scheme: light;
  --bg: hsl(var(--host-background, 210 20% 98%));
  --surface: hsl(var(--host-card, 0 0% 100%));
  --surface-subtle: hsl(var(--host-muted, 210 20% 96%));
  --text: hsl(var(--host-foreground, 222 47% 11%));
  --muted: hsl(var(--host-muted-foreground, 215 16% 47%));
  --border: hsl(var(--host-border, 214 18% 88%));
  --border-strong: color-mix(in srgb, var(--text) 28%, var(--border));
  --primary: hsl(var(--host-primary, 222 47% 11%));
  --primary-foreground: hsl(var(--host-primary-foreground, 210 40% 98%));
  --primary-hover: color-mix(in srgb, var(--primary) 88%, var(--text));
  --accent: hsl(var(--host-accent, 210 20% 96%));
  --accent-foreground: hsl(var(--host-accent-foreground, 222 47% 11%));
  --danger: hsl(var(--host-destructive, 0 84% 60%));
  --amber: hsl(var(--host-status-warning, 38 92% 50%));
  --shadow: 0 10px 28px color-mix(in srgb, var(--text) 12%, transparent);
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--host-font-family, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: 14px;
  line-height: 1.45;
  letter-spacing: 0;
}

button,
input,
select,
textarea {
  color: inherit;
  font: inherit;
  letter-spacing: 0;
}

button {
  cursor: pointer;
}

button svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2;
}

button:disabled,
input:disabled,
select:disabled {
  cursor: not-allowed;
  opacity: 0.52;
}

.hidden {
  display: none !important;
}

/* ── 页面骨架 ── */

.page {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-height: 100vh;
}

.page-header {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
}

.header-copy {
  min-width: 0;
}

.header-copy h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 500;
}

.header-copy p {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.page-status {
  min-height: 0;
  margin: 0;
  padding: 8px 24px 0;
  color: var(--muted);
  font-size: 13px;
}

.page-status.error {
  color: var(--danger);
}

.page-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 24px 24px;
}

/* ── 按钮 ── */

.btn-outline,
.btn-ghost,
.btn-sm,
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

.btn-outline {
  height: 36px;
  gap: 4px;
  padding: 0 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
}

.btn-outline:hover:not(:disabled) {
  border-color: var(--border-strong);
  background: var(--surface-subtle);
}

.btn-ghost {
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
}

.btn-ghost:hover:not(:disabled) {
  background: var(--accent);
}

.btn-sm {
  height: 36px;
  padding: 0 12px;
}

.icon-btn {
  width: 40px;
  flex: 0 0 40px;
  padding: 0 12px;
}

.danger {
  color: var(--danger);
}

.danger:hover:not(:disabled) {
  color: var(--danger);
  background: color-mix(in srgb, var(--danger) 10%, transparent);
}

.spinable.spinning {
  animation: spin 0.8s linear infinite;
}

/* ── 状态 / 空态 ── */

.state-center {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 0;
  color: var(--muted);
}

.state-center .spin {
  width: 20px;
  height: 20px;
  margin-right: 8px;
  animation: spin 0.8s linear infinite;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2;
}

.state-center.empty {
  flex-direction: column;
}

.empty-icon {
  width: 40px;
  height: 40px;
  margin-bottom: 12px;
  fill: none;
  opacity: 0.4;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2;
}

.empty p {
  margin: 0;
  font-size: 14px;
}

.empty .text-xs {
  margin-top: 4px;
  font-size: 12px;
}

/* ── 索引列表 ── */

.index-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.index-row {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
}

.row-icon {
  width: 20px;
  height: 20px;
  margin-top: 1px;
  flex: 0 0 20px;
  fill: none;
  stroke: var(--muted);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2;
}

.row-main {
  min-width: 0;
  flex: 1;
}

.row-title {
  margin: 0;
  overflow: hidden;
  font-size: 14px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.row-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.row-meta .warning {
  color: var(--amber);
}

.row-actions {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 8px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
</style>
</head>
<body>
  <main class="page">
    <!-- 顶部标题栏（对齐原版 IndexManagementSettings header） -->
    <header class="page-header">
      <div class="header-copy">
        <h3>索引管理</h3>
        <p>管理工作区文件索引。Session 索引随会话生命周期自动管理。</p>
      </div>
      <button id="refresh-btn" class="btn-outline btn-sm" type="button">
        <svg id="refresh-icon" class="btn-icon spinable" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
        刷新
      </button>
    </header>

    <p id="status" class="page-status" role="status" hidden></p>

    <div class="page-body">
      <!-- 加载态 -->
      <div id="loading-state" class="state-center" hidden>
        <svg class="spin" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        加载中...
      </div>

      <!-- 空态 -->
      <div id="empty-state" class="state-center empty" hidden>
        <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true">
          <ellipse cx="12" cy="5" rx="9" ry="3" />
          <path d="M3 5V19A9 3 0 0 0 21 19V5" />
          <path d="M3 12A9 3 0 0 0 21 12" />
        </svg>
        <p>暂无工作区索引</p>
        <p class="text-xs">切换工作目录后自动创建索引</p>
      </div>

      <!-- 索引列表 -->
      <div id="list" class="index-list"></div>
    </div>

    <template id="row-template">
      <article class="index-row">
        <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" />
        </svg>
        <div class="row-main">
          <p class="row-title"></p>
          <div class="row-meta">
            <span class="row-count"></span>
            <span class="row-updated"></span>
          </div>
        </div>
        <div class="row-actions">
          <button class="btn-ghost btn-sm icon-btn rebuild-btn" type="button" title="重建索引" aria-label="重建索引">
            <svg class="spinable" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
            </svg>
          </button>
          <button class="btn-ghost btn-sm icon-btn danger delete-btn" type="button" title="删除索引" aria-label="删除索引">
            <svg class="spinable" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18" />
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
              <line x1="10" x2="10" y1="11" y2="17" />
              <line x1="14" x2="14" y1="11" y2="17" />
            </svg>
          </button>
        </div>
      </article>
    </template>
  </main>
  <script>// 索引管理设置页脚本。
//
// 与 memory.js 同构的 host context + callHost 桥接框架：
// - 启动时发 plugin_host_ready，等待宿主回传 host context（主题 + CSS token + channel）
// - callHost(method, payload) 经 postMessage 把请求发回宿主，宿主调 pluginCall 转发到 WASM
//   的 handle_view_message，结果回传（天工不解析消息内容，只做透传）

// 与 sidecar request_timeout_ms（60s）对齐，留出 IPC 通信余量。
// 大工作区重建耗时较长，30s 会先于 sidecar 失败导致前端误报。
const HOST_TIMEOUT_MS = 90000;
let hostChannel = null;
let hostReadyResolve = null;
const hostReady = new Promise((resolve) => {
  hostReadyResolve = resolve;
});
let requestSequence = 0;

function applyHostContext(context) {
  if (hostChannel && context.channel !== hostChannel) return;
  hostChannel = context.channel;
  const root = document.documentElement;
  root.dataset.theme = context.theme === "dark" ? "dark" : "light";
  Object.entries(context.tokens || {}).forEach(([name, value]) => {
    if (typeof value === "string" && value) {
      root.style.setProperty(`--host-${name}`, value);
    }
  });
  if (typeof context.fontFamily === "string" && context.fontFamily) {
    root.style.setProperty("--host-font-family", context.fontFamily);
  }
  hostReadyResolve?.();
  hostReadyResolve = null;
}

window.addEventListener("message", (event) => {
  if (event.source !== window.parent || !event.data) return;
  if (event.data.type === "tiangong_host_context" && typeof event.data.channel === "string") {
    applyHostContext(event.data);
  }
});
window.parent.postMessage({ type: "plugin_host_ready" }, "*");

async function callHost(method, payload = "") {
  if (!hostChannel) await hostReady;
  return new Promise((resolve, reject) => {
    const id = `index-${Date.now()}-${++requestSequence}`;
    const channel = hostChannel;
    const timeout = window.setTimeout(() => {
      window.removeEventListener("message", handler);
      reject(new Error("插件请求超时"));
    }, HOST_TIMEOUT_MS);
    const handler = (event) => {
      if (
        event.source !== window.parent ||
        !event.data ||
        event.data.id !== id ||
        event.data.channel !== channel
      )
        return;
      window.clearTimeout(timeout);
      window.removeEventListener("message", handler);
      if (event.data.error) {
        reject(new Error(String(event.data.error)));
      } else {
        resolve(event.data.result ?? "");
      }
    };
    window.addEventListener("message", handler);
    // v2 无 wasm 桥接：宿主方法经宿主桥 sidecar.* 直达插件 sidecar。
    window.parent.postMessage(
      { type: "plugin_call", channel, id, method: `sidecar.${method}`, payload: payload === "" ? "{}" : payload },
      "*",
    );
  });
}

// ── 索引管理业务（对齐原版 IndexManagementSettings）──

const listEl = document.getElementById("list");
const statusEl = document.getElementById("status");
const loadingState = document.getElementById("loading-state");
const emptyState = document.getElementById("empty-state");
const refreshBtn = document.getElementById("refresh-btn");
const refreshIcon = document.getElementById("refresh-icon");
const rowTemplate = document.getElementById("row-template");

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", isError);
  statusEl.hidden = !text;
}

function showLoading() {
  loadingState.hidden = false;
  emptyState.hidden = true;
  listEl.innerHTML = "";
}

function renderList(items) {
  loadingState.hidden = true;
  emptyState.hidden = items.length !== 0;
  listEl.innerHTML = "";
  if (items.length === 0) return;

  for (const item of items) {
    const node = rowTemplate.content.firstElementChild.cloneNode(true);
    const root = item.root || `未知来源 (${String(item.id).slice(0, 12)}…)`;
    node.querySelector(".row-title").textContent = root;
    node.querySelector(".row-title").title = root;

    const countEl = node.querySelector(".row-count");
    countEl.textContent = `${item.entry_count ?? 0} 个文件`;

    const updatedEl = node.querySelector(".row-updated");
    if (item.updated_at) {
      updatedEl.textContent = `更新于 ${String(item.updated_at).replace("T", " ").slice(0, 19)}`;
    } else {
      updatedEl.textContent = "未记录时间";
      updatedEl.classList.add("warning");
    }

    const rebuildBtn = node.querySelector(".rebuild-btn");
    const deleteBtn = node.querySelector(".delete-btn");
    if (item.root) {
      rebuildBtn.addEventListener("click", () => rebuild(item, rebuildBtn));
    } else {
      rebuildBtn.hidden = true;
    }
    deleteBtn.addEventListener("click", () => remove(item, deleteBtn));

    listEl.appendChild(node);
  }
}

async function loadIndexes() {
  showLoading();
  refreshBtn.disabled = true;
  refreshIcon.classList.add("spinning");
  setStatus("");
  try {
    const raw = await callHost("index.list_workspace_indexes", "{}");
    const items = raw ? JSON.parse(raw) : [];
    renderList(Array.isArray(items) ? items : []);
    setStatus("");
  } catch (e) {
    renderList([]);
    setStatus(`加载索引列表失败：${e.message || e}`, true);
  } finally {
    refreshBtn.disabled = false;
    refreshIcon.classList.remove("spinning");
  }
}

async function rebuild(item, btn) {
  btn.disabled = true;
  btn.querySelector("svg").classList.add("spinning");
  setStatus(`重建中：${item.root || item.id} …`);
  try {
    const raw = await callHost("index.rebuild_workspace_index", JSON.stringify({ root: item.root }));
    await loadIndexes();
    const count = Number(raw ? JSON.parse(raw) : NaN);
    setStatus(Number.isFinite(count) ? `索引重建完成，共 ${count} 个文件` : "索引重建完成");
  } catch (e) {
    setStatus(`重建索引失败：${e.message || e}`, true);
  } finally {
    btn.disabled = false;
    btn.querySelector("svg").classList.remove("spinning");
  }
}

async function remove(item, btn) {
  btn.disabled = true;
  btn.querySelector("svg").classList.add("spinning");
  setStatus(`删除中：${item.root || item.id} …`);
  try {
    await callHost(
      "delete",
      JSON.stringify({ root: item.root, workspace_id: item.id }),
    );
    await loadIndexes();
    setStatus("索引已删除");
  } catch (e) {
    setStatus(`删除索引失败：${e.message || e}`, true);
  } finally {
    btn.disabled = false;
    btn.querySelector("svg").classList.remove("spinning");
  }
}

refreshBtn.addEventListener("click", loadIndexes);

// 挂载即加载列表。
loadIndexes();
</script>
</body>
</html>
