[package]
name = "tiangong-plugin-computer-use-sidecar"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
description = "Computer Use 独立 sidecar 进程（访问 Windows UI Automation / macOS AXUIElement / Linux AT-SPI2）"
publish = false

[[bin]]
name = "tiangong-computer-use-sidecar"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tiangong-plugin-computer-use-protocol = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
tiangong-types = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
scru128 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "time", "io-util", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# macOS 后端：objc2 系列用于 NSWorkspace 列举应用，core-foundation 用于处理
# AXUIElement C API 返回的 CFString/CFArray/CFBoolean/CFNumber 值。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSEnumerator", "NSProcessInfo", "NSData", "NSDate", "NSRunLoop"] }
# NSImageView/NSImage/NSColor/NSScreen 用于虚拟指针 overlay（RFC 0018）。
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSApplication", "NSWindow", "NSImageView", "NSImage", "NSColor", "NSScreen", "NSBox", "NSTextField", "NSControl", "NSView", "NSResponder", "NSFont", "NSFontDescriptor", "NSText"] }
core-foundation = "0.10"
# CGEvent 合成输入（desktop_mouse 手势，RFC 0018 §2.3）；highsierra
# feature 提供像素级滚轮事件（CGEventCreateScrollWheelEvent2）。
core-graphics = { version = "0.25", features = ["highsierra", "elcapitan"] }

# Linux 后端：纯 Rust AT-SPI2 实现（zbus 基于 D-Bus）。
[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.22", features = ["tokio", "proxies", "connection", "zbus"] }

# Windows 后端：UI Automation 封装（基于 windows-rs）。
[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.16"
# 与 uiautomation 同版本的 windows-rs（lockfile 已有，不新增依赖包）：
# SendInput 键鼠合成、GDI 截图 + WIC JPEG 编码、分层窗口指针/按键 HUD、
# 应用唤起（ShellExecuteEx）与 Per-Monitor DPI 感知。
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
