<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="frame" x1="6" y1="7" x2="42" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="screen" x1="9" y1="11" x2="39" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="cathode" cx="14" cy="14" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="28" cy="24" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 显示器 -->
  <rect x="6" y="7" width="36" height="26" rx="4" fill="url(#frame)"/>
  <rect x="9" y="10" width="30" height="20" rx="2.4" fill="url(#screen)"/>
  <rect x="9" y="10" width="30" height="20" rx="2.4" fill="url(#cathode)"/>
  <rect x="20" y="33" width="8" height="4" fill="#4338CA"/>
  <rect x="15" y="37" width="18" height="3" rx="1.5" fill="#4338CA"/>
  <!-- 输入文本行（打字中） -->
  <rect x="12.5" y="14" width="17" height="4" rx="1.2" fill="#A5B4FC" fill-opacity="0.45"/>
  <rect x="12.5" y="20.5" width="11" height="4" rx="1.2" fill="#A5B4FC" fill-opacity="0.3"/>
  <!-- 光标 -->
  <path d="M25.5 20.5v7.6" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="28" cy="24" r="9" fill="url(#glow)"/>
  <!-- 点击涟漪 -->
  <circle cx="28" cy="24" r="5.5" stroke="#FDE68A" stroke-width="1.6" stroke-opacity="0.8" fill="none"/>
