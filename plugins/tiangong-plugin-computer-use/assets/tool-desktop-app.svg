<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="frame" x1="6" y1="7" x2="42" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="screen" x1="9" y1="11" x2="39" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="cathode" cx="14" cy="14" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <!-- 显示器 -->
  <rect x="6" y="7" width="36" height="26" rx="4" fill="url(#frame)"/>
  <rect x="9" y="10" width="30" height="20" rx="2.4" fill="url(#screen)"/>
  <rect x="9" y="10" width="30" height="20" rx="2.4" fill="url(#cathode)"/>
  <rect x="20" y="33" width="8" height="4" fill="url(#stand)"/>
  <rect x="15" y="37" width="18" height="3" rx="1.5" fill="#4338CA"/>
  <!-- App 网格（唤起应用） -->
  <rect x="13.5" y="13.5" width="6.4" height="6.4" rx="1.8" fill="url(#app)"/>
  <rect x="22.8" y="13.5" width="6.4" height="6.4" rx="1.8" fill="#A5B4FC" fill-opacity="0.8"/>
  <rect x="32.1" y="13.5" width="6.4" height="6.4" rx="1.8" fill="#818CF8" fill-opacity="0.5"/>
  <rect x="13.5" y="22.8" width="6.4" height="6.4" rx="1.8" fill="#A5B4FC" fill-opacity="0.5"/>
  <rect x="22.8" y="22.8" width="6.4" height="6.4" rx="1.8" fill="url(#app)"/>
  <rect x="32.1" y="22.8" width="6.4" height="6.4" rx="1.8" fill="#C7D2FE" fill-opacity="0.4"/>
  <!-- 高亮 App 的运行点 -->
  <circle cx="19.1" cy="13.9" r="1.2" fill="#FBBF24"/>
</svg>
