[package]
name = "tiangong-plugin-subagent-sidecar"
version = "0.2.39"
edition = "2024"
license = "Apache-2.0"
description = "Subagent 插件 sidecar：持久 Agent 注册表、会话激活、任务运行与 Hook 投递总线"
publish = false

[[bin]]
name = "tiangong-subagent-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-subagent-protocol = { workspace = true }
tiangong-plugin-sidecar = { path = "../../../crates/tiangong-plugin-sidecar" }
tiangong-plugin-runtime = { path = "../../../crates/tiangong-plugin-runtime" }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "process", "io-util", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
scru128 = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls"] }
tempfile = "3"

fs2 = "0.4"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serial_test = "4"
