<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- 星芒：琥珀金色渐变（skill 家族 sparkles 标识） -->
    <linearGradient id="star" x1="15" y1="2" x2="31" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset="0.5" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="star2" x1="31" y1="3" x2="36" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- 星芒柔光 -->
    <radialGradient id="star-glow" cx="23" cy="10.5" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE68A" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#FBBF24" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <!-- 书封：靛蓝渐变 -->
    <linearGradient id="cover" x1="6.5" y1="20" x2="41.5" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
  </defs>

  <!-- 主星芒（四角星，凹边）与柔光 -->
  <circle cx="23" cy="10.5" r="12" fill="url(#star-glow)"/>
  <path d="M23 2 Q24.2 8.3 30.5 10.5 Q24.2 12.7 23 19 Q21.8 12.7 15.5 10.5 Q21.8 8.3 23 2 Z" fill="url(#star)"/>
  <path d="M23 6.2 Q23.7 9.4 27 10.5 Q23.7 11.6 23 14.8 Q22.3 11.6 19 10.5 Q22.3 9.4 23 6.2 Z" fill="#FFFFFF" fill-opacity="0.75"/>

  <!-- 副星芒 -->
  <path d="M33.5 2.6 Q34.1 5.4 36.4 6 Q34.1 6.6 33.5 9.4 Q32.9 6.6 30.6 6 Q32.9 5.4 33.5 2.6 Z" fill="url(#star2)"/>

  <!-- 翻开的书：书封 -->
  <path d="M6.5 24.4 L24 20.2 L41.5 24.4 L41.5 38.6 Q24 44.6 6.5 38.6 Z" fill="url(#cover)"/>
  <path d="M6.5 24.4 L24 20.2 L41.5 24.4" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round"/>

  <!-- 书页 -->
  <path d="M8.8 25.5 L24 22 L24 41.4 Q16.6 40.9 8.8 37.1 Z" fill="#EEF2FF"/>
  <path d="M39.2 25.5 L24 22 L24 41.4 Q31.4 40.9 39.2 37.1 Z" fill="#EEF2FF"/>
  <path d="M24 22 V41.4" stroke="#C7D2FE" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 正文行 -->
  <g stroke="#6366F1" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round">
    <path d="M11.5 28.2 L20.5 26.4"/>
    <path d="M11.5 31.3 L20.5 29.5"/>
    <path d="M11.5 34.4 L17.5 33"/>
    <path d="M27.5 26.4 L36.5 28.2"/>
    <path d="M27.5 29.5 L36.5 31.3"/>
    <path d="M30.5 33 L36.5 34.4"/>
  </g>
</svg>
