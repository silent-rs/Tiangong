[package]
name = "tiangong-plugin-skill-sidecar"
version = "0.2.6"
edition = "2024"
license = "Apache-2.0"
description = "Skill 独立 sidecar 进程（承载 skill 注册表扫描、skill.toml 读写与审计日志）"
publish = false

[[bin]]
name = "tiangong-skill-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-skill-protocol = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "sync", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
toml = { workspace = true }
chrono = { workspace = true }
