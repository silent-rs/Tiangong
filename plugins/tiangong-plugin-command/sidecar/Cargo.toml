[package]
name = "tiangong-plugin-command-sidecar"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Command 独立 sidecar 进程（承载 tokio 子进程 spawn、命令校验策略、env 注入）"
publish = false

[[bin]]
name = "tiangong-command-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-command-protocol = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
tiangong-toolkit = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "time", "io-util", "process", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
