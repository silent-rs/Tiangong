[package]
name = "tiangong-plugin-generate-image-openai-sidecar"
version = "0.2.9"
edition = "2024"
license = "Apache-2.0"
description = "Generate-Image-OpenAI 独立 sidecar（Chat Completions 生图、配置持久化、归档落盘）"
publish = false

[[bin]]
name = "tiangong-generate-image-openai-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-generate-image-openai-protocol = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-config = { workspace = true }
tiangong-media-archive = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls"] }
webpki-root-certs = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
