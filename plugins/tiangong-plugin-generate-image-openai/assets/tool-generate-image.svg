  </defs>
  <!-- 画布相框 -->
  <rect x="7" y="8" width="34" height="28" rx="5" fill="url(#canvas)"/>
  <rect x="7" y="8" width="34" height="28" rx="5" fill="url(#sheen)"/>
  <!-- 生成中的画面：山与日 -->
  <path d="M12.5 31.5l7.5-9.5 5.5 7 4-5 6.5 7.5a1.8 1.8 0 0 1-1.4 3H14.2a1.9 1.9 0 0 1-1.7-3z" fill="url(#photo)"/>
  <circle cx="18" cy="17.5" r="3.2" fill="#F0ABFC"/>
  <!-- 生成光晕（星芒组） -->
  <path d="M34 4.5c.6 4 1.9 5.3 5.9 5.9-4 .6-5.3 1.9-5.9 5.9-.6-4-1.9-5.3-5.9-5.9 4-.6 5.3-1.9 5.9-5.9z" fill="url(#spark)"/>
  <path d="M40.8 17.4c.35 2.3 1.1 3.05 3.4 3.4-2.3.35-3.05 1.1-3.4 3.4-.35-2.3-1.1-3.05-3.4-3.4 2.3-.35 3.05-1.1 3.4-3.4z" fill="url(#rays)"/>
