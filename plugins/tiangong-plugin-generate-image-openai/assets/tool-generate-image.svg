    </radialGradient>
    <linearGradient id="rays" x1="34" y1="4" x2="34" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0ABFC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0.4"/>
