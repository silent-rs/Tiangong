[package]
name = "tiangong-plugin-coding-sidecar"
version = "0.2.4"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "tiangong-coding-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-coding-protocol = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono = { workspace = true, default-features = false, features = ["std", "clock"] }
hex = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
