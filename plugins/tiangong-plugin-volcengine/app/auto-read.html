<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>自动朗读</title>
  <style>
    :host, .ar-root { all: initial; }
    .ar-root { display: inline-flex; align-items: center; font-family: var(--host-font-family, inherit); }
    .ar-btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 0; border-radius: 4px;
      background: transparent; cursor: pointer; font: inherit; font-size: 12px;
      color: hsl(var(--muted-foreground, 215.4 16.3% 46.9%));
    }
    .ar-btn:hover { color: hsl(var(--foreground, 222.2 47.4% 11.2%)); }
    .ar-btn.is-on { background: hsl(var(--primary, 222.2 47.4% 11.2%)); color: hsl(var(--primary-foreground, 210 40% 98%)); }
    .ar-btn.is-playing svg { animation: ar-pulse 1s ease-in-out infinite; }
    @keyframes ar-pulse { 50% { opacity: .4; } }
    svg { width: 14px; height: 14px; display: block; }
  </style>
</head>
<body>
  <div class="ar-root">
    <button class="ar-btn" id="ar-btn" type="button"></button>
  </div>
  <script>
    // 状态栏自动朗读开关（global.status-item）：订阅宿主推送的回复正文
    // （session.stream.text）与轮次结束（session.turn.completed），按句合成并顺序播放。
    // 只朗读当前会话；切换会话或关闭开关即停止。
    const uiRoot = typeof pluginRoot !== 'undefined' && pluginRoot ? pluginRoot : document;
    const button = uiRoot.getElementById('ar-btn');
    const SENTENCE_END = /[。！？；!?;\n]|[.](?=\s)/;
    const STORAGE_KEY = 'tiangong-volcengine-auto-read';
    const ICON_OFF = '<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/>';
    const ICON_ON = '<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>';

    const state = {
      enabled: localStorage.getItem(STORAGE_KEY) === '1',
      sessionId: (typeof hostContext !== 'undefined' && hostContext && hostContext.session && hostContext.session.id) || null,
      buffer: '',
      sentences: [],
      audios: [],
      synthesizing: false,
      playing: false,
      generation: 0,
    };
    const unsubscribers = [];

    async function call(method, payload) {
      const raw = await bridge.call(method, JSON.stringify(payload || {}));
      return raw ? JSON.parse(raw) : null;
    }

    function render() {
      button.className = `ar-btn${state.enabled ? ' is-on' : ''}${state.playing ? ' is-playing' : ''}`;
      const title = state.enabled ? '关闭自动朗读' : '开启自动朗读';
      button.title = title;
      button.setAttribute('aria-label', title);
      button.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${state.enabled ? ICON_ON : ICON_OFF}</svg>`;
    }

    function reset() {
      state.generation += 1;
      state.buffer = '';
      state.sentences = [];
      state.audios = [];
      state.synthesizing = false;
      state.playing = false;
      call('plugin.stop', {}).catch(() => {});
      render();
    }

    function takeSentences(flush) {
      for (;;) {
        const match = SENTENCE_END.exec(state.buffer);
        if (!match) break;
        const end = match.index + match[0].length;
        const sentence = state.buffer.slice(0, end).trim();
        state.buffer = state.buffer.slice(end);
        if (sentence) state.sentences.push(sentence);
      }
      if (flush && state.buffer.trim()) {
        state.sentences.push(state.buffer.trim());
        state.buffer = '';
      }
      void synthesizeNext();
    }

    async function synthesizeNext() {
      if (state.synthesizing || state.sentences.length === 0) return;
      const generation = state.generation;
      state.synthesizing = true;
      const sentence = state.sentences.shift();
      try {
        const result = await call('plugin.synthesize', { text: sentence });
        if (generation !== state.generation) return;
        state.audios.push(result.file_path);
        void playNext();
      } catch (error) {
        console.warn('[auto-read] 合成失败', error);
      } finally {
        if (generation === state.generation) {
          state.synthesizing = false;
          void synthesizeNext();
        }
      }
    }

    async function playNext() {
      if (state.playing || state.audios.length === 0) return;
      const generation = state.generation;
      state.playing = true;
      render();
      const path = state.audios.shift();
      try {
        await call('plugin.play', { file_path: path });
        for (;;) {
          const status = await call('plugin.play_status', {});
          if (!status || !status.playing || generation !== state.generation) break;
          await new Promise((resolve) => setTimeout(resolve, 200));
        }
      } catch (error) {
        console.warn('[auto-read] 播放失败', error);
      } finally {
        if (generation === state.generation) {
          state.playing = false;
          render();
          void playNext();
        }
      }
    }

    function onText(raw) {
      if (!state.enabled) return;
      let event;
      try { event = JSON.parse(raw); } catch { return; }
      if (!event || event.session_id !== state.sessionId) return;
      state.buffer += event.content || '';
      takeSentences(false);
    }

    function onTurnCompleted(raw) {
      if (!state.enabled) return;
      let event;
      try { event = JSON.parse(raw); } catch { return; }
      if (!event || event.session_id !== state.sessionId) return;
      takeSentences(true);
    }

    function subscribe() {
      if (unsubscribers.length) return;
      unsubscribers.push(bridge.on('session.stream.text', onText));
      unsubscribers.push(bridge.on('session.turn.completed', onTurnCompleted));
    }

    function unsubscribe() {
      while (unsubscribers.length) unsubscribers.pop()();
    }

    button.addEventListener('click', () => {
      state.enabled = !state.enabled;
      localStorage.setItem(STORAGE_KEY, state.enabled ? '1' : '0');
      reset();
      if (state.enabled) subscribe();
      else unsubscribe();
    });

    if (typeof onHostContextChange === 'function') {
      onHostContextChange((context) => {
        const next = (context && context.session && context.session.id) || null;
        if (next !== state.sessionId) {
          state.sessionId = next;
          if (state.playing || state.synthesizing || state.sentences.length) reset();
        }
      });
    }
    if (typeof registerCleanup === 'function') {
      registerCleanup(() => {
        unsubscribe();
        if (state.playing) call('plugin.stop', {}).catch(() => {});
      });
    }
    if (state.enabled) subscribe();
    render();
  </script>
</body>
</html>
