<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>火山引擎</title>
  <style>
:root {
  color-scheme: light;
  --bg: hsl(var(--host-background, 210 20% 98%));
  --surface: hsl(var(--host-card, 0 0% 100%));
  --text: hsl(var(--host-foreground, 222 47% 11%));
  --muted: hsl(var(--host-muted-foreground, 215 16% 47%));
  --border: hsl(var(--host-border, 214 18% 88%));
  --primary: hsl(var(--host-primary, 222 47% 11%));
  --primary-foreground: hsl(var(--host-primary-foreground, 210 40% 98%));
  --accent: hsl(var(--host-accent, 210 40% 96%));
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--host-font-family, Inter, ui-sans-serif, system-ui, sans-serif);
  font-size: 14px;
  line-height: 1.5;
}

.page {
  width: 100%;
  max-width: 960px;
  padding: 24px 24px 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.header h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
.header .desc { margin: 0; color: var(--muted); font-size: 13px; }
.header a, .hint a, .card-desc a { color: inherit; }

.card {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}
.card-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.card-title { margin: 0; font-size: 14px; font-weight: 600; }
.card-desc { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.card-body {
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px 16px;
  align-items: start;
}
.span-2 { grid-column: 1 / -1; }
@media (max-width: 640px) {
  .card-body { grid-template-columns: minmax(0, 1fr); }
}

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.label { font-size: 13px; font-weight: 500; }
.hint { color: var(--muted); font-size: 12px; }
.hint.error { color: hsl(0 84% 60%); }

.input {
  width: 100%;
  height: 36px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
}
.input:focus { outline: none; border-color: var(--primary); }

.check {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  cursor: pointer;
  font-size: 13px;
}
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); }

.actions {
  position: sticky;
  bottom: 0;
  margin: 0 -24px;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg);
  border-top: 1px solid var(--border);
}
.status { color: var(--muted); font-size: 13px; flex: 1; }
.status.error { color: hsl(0 84% 60%); }
.status.success { color: hsl(142 71% 40%); }

.btn {
  height: 34px;
  padding: 0 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font: inherit;
  font-weight: 500;
  white-space: nowrap;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); padding: 0 20px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="header">
      <h2>火山引擎 · Agent Plan</h2>
      <p class="desc">使用火山方舟 Agent Plan 订阅套餐的专属 API Key 提供图片生成、视频生成、语音合成与语音识别。</p>
    </div>

    <section class="card">
      <div class="card-head">
        <div>
          <h3 class="card-title">凭据</h3>
          <p class="card-desc">图片、视频与语音共用同一个 API Key，支持 ${ENV_VAR} 引用环境变量。</p>
        </div>
      </div>
      <div class="card-body">
        <label class="field span-2">
          <span class="label">Agent Plan API Key</span>
          <input id="api-key" class="input" type="password" placeholder="Agent Plan 专属 API Key（其他方舟 Key 不可用）" autocomplete="off" />
          <span class="hint">在方舟控制台「开通管理 → Agent Plan」中获取。</span>
        </label>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h3 class="card-title">模型</h3>
          <p class="card-desc">填写套餐支持的模型名称，可从候选中选择或手动输入；可用模型以<a href="https://docs.volcengine.com/docs/ark/agent-plan-personal-plan-overview?lang=zh" target="_blank" rel="noopener noreferrer">套餐概览</a>为准。</p>
        </div>
      </div>
      <div class="card-body">
        <label class="field">
          <span class="label">图片生成</span>
          <input id="image-model" class="input" type="text" list="image-model-list" placeholder="留空则不提供生图" autocomplete="off" />
          <datalist id="image-model-list"></datalist>
        </label>
        <label class="field">
          <span class="label">视频生成</span>
          <input id="video-model" class="input" type="text" list="video-model-list" placeholder="留空则不提供生视频" autocomplete="off" />
          <datalist id="video-model-list"></datalist>
          <span class="hint">Small / Medium 套餐不含视频生成。</span>
        </label>
        <label class="field">
          <span class="label">语音合成</span>
          <input id="tts-model" class="input" type="text" list="tts-model-list" placeholder="doubao-seed-tts-2.0" autocomplete="off" />
          <datalist id="tts-model-list"></datalist>
        </label>
        <label class="field">
          <span class="label">语音识别</span>
          <input id="asr-model" class="input" type="text" list="asr-model-list" placeholder="doubao-seed-asr-2.0" autocomplete="off" />
          <datalist id="asr-model-list"></datalist>
          <span class="hint">流式识别，支持 wav / mp3 / ogg（16k 采样率）。</span>
        </label>
        <div class="field span-2">
          <span class="label">文本模型（在「模型配置」中使用）</span>
          <span class="hint">Base URL：<code>https://ark.cn-beijing.volces.com/api/plan</code>（Anthropic 兼容），API Key 同上。</span>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h3 class="card-title">生成与语音选项</h3>
        </div>
      </div>
      <div class="card-body">
        <label class="field">
          <span class="label">视频等待上限（秒）</span>
          <input id="video-timeout" class="input" type="number" min="30" step="10" placeholder="300" />
          <span class="hint">超时后返回任务 ID，任务在服务端继续执行。</span>
        </label>
        <div class="field">
          <span class="label">水印</span>
          <label class="check">
            <input id="watermark" type="checkbox" />
            <span>生成结果添加 AI 生成水印</span>
          </label>
        </div>
        <label class="field">
          <span class="label">默认音色</span>
          <input id="tts-speaker" class="input" type="text" list="tts-speaker-list" placeholder="zh_female_vv_uranus_bigtts" autocomplete="off" />
          <datalist id="tts-speaker-list"></datalist>
          <span class="hint">音色需与语音合成模型版本对应（*_uranus_bigtts 为 2.0 音色）。</span>
        </label>
      </div>
    </section>

    <div class="actions">
      <span id="status" class="status"></span>
      <button id="save-btn" class="btn btn-primary" type="button">保存</button>
    </div>
  </main>
  <script>
// 火山引擎（Agent Plan）设置页脚本（postMessage 桥接到插件 WASM → sidecar）。

const HOST_TIMEOUT_MS = 60000;
const DEFAULT_VIDEO_TIMEOUT = 300;
const DEFAULT_TTS_SPEAKER = "zh_female_vv_uranus_bigtts";
const DEFAULT_TTS_MODEL = "doubao-seed-tts-2.0";
const DEFAULT_ASR_MODEL = "doubao-seed-asr-2.0";
// 候选模型取自官方「Agent Plan 套餐概览 → 支持模型及 Harness」，仅作输入提示；
// 官方模型发生较大变化时随插件版本阶段性更新，期间可直接手动填写新模型名。
const MODEL_SUGGESTIONS = {
  image: ["doubao-seedream-5-0-pro", "doubao-seedream-5.0-lite"],
  video: ["doubao-seedance-2.0", "doubao-seedance-2.0-fast", "doubao-seedance-2.0-mini", "doubao-seedance-2.5"],
  tts: ["doubao-seed-tts-2.0"],
  asr: ["doubao-seed-asr-2.0"],
};
let hostChannel = null;
let hostReadyResolve = null;
const hostReady = new Promise((resolve) => { hostReadyResolve = resolve; });
let requestSequence = 0;

function applyHostContext(context) {
  if (hostChannel && context.channel !== hostChannel) return;
  hostChannel = context.channel;
  const root = document.documentElement;
  root.dataset.theme = context.theme === "dark" ? "dark" : "light";
  Object.entries(context.tokens || {}).forEach(([name, value]) => {
    if (typeof value === "string" && value) root.style.setProperty(`--host-${name}`, value);
  });
  if (typeof context.fontFamily === "string" && context.fontFamily) {
    root.style.setProperty("--host-font-family", context.fontFamily);
  }
  hostReadyResolve?.();
  hostReadyResolve = null;
}

window.addEventListener("message", (event) => {
  if (event.source !== window.parent || !event.data) return;
  if (event.data.type === "tiangong_host_context" && typeof event.data.channel === "string") {
    applyHostContext(event.data);
  }
});
window.parent.postMessage({ type: "plugin_host_ready" }, "*");

async function callHost(method, payload = "") {
  if (!hostChannel) await hostReady;
  return new Promise((resolve, reject) => {
    const id = `volc-${Date.now()}-${++requestSequence}`;
    const channel = hostChannel;
    const timeout = window.setTimeout(() => {
      window.removeEventListener("message", handler);
      reject(new Error("插件请求超时"));
    }, HOST_TIMEOUT_MS);
    const handler = (event) => {
      if (event.source !== window.parent || !event.data || event.data.id !== id || event.data.channel !== channel) return;
      window.clearTimeout(timeout);
      window.removeEventListener("message", handler);
      if (event.data.error) reject(new Error(String(event.data.error)));
      else resolve(event.data.result ?? "");
    };
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "plugin_call", channel, id, method, payload }, "*");
  });
}

// ── DOM ──

const $ = (id) => document.getElementById(id);
const apiKey = $("api-key");
const videoTimeout = $("video-timeout");
const watermark = $("watermark");
const ttsSpeaker = $("tts-speaker");
const ttsSpeakerList = $("tts-speaker-list");
const modelInputs = {
  image: $("image-model"),
  video: $("video-model"),
  tts: $("tts-model"),
  asr: $("asr-model"),
};
const saveBtn = $("save-btn");
const statusEl = $("status");

function setStatus(message, type) {
  statusEl.textContent = message;
  statusEl.className = `status${type ? ` ${type}` : ""}`;
}

function errorText(error) {
  return (error && error.message) || String(error);
}

// ── 模型候选 ──

function fillSuggestions() {
  Object.entries(MODEL_SUGGESTIONS).forEach(([kind, models]) => {
    $(`${kind}-model-list`).replaceChildren(...models.map((id) => {
      const option = document.createElement("option");
      option.value = id;
      return option;
    }));
  });
}

// ── 加载 ──

async function loadConfig() {
  let config = {};
  try {
    const raw = await callHost("bootstrap", "{}");
    config = raw ? JSON.parse(raw) : {};
  } catch (error) {
    setStatus(`加载失败：${errorText(error)}`, "error");
  }
  apiKey.value = config.api_key || "";
  videoTimeout.value = String(config.video_poll_timeout_secs || DEFAULT_VIDEO_TIMEOUT);
  watermark.checked = Boolean(config.watermark);
  ttsSpeaker.value = config.tts_speaker || DEFAULT_TTS_SPEAKER;
  modelInputs.image.value = config.image_model || "";
  modelInputs.video.value = config.video_model || "";
  modelInputs.tts.value = config.tts_model || DEFAULT_TTS_MODEL;
  modelInputs.asr.value = config.asr_model || DEFAULT_ASR_MODEL;
}

async function loadVoices() {
  try {
    const raw = await callHost("list_voices", "{}");
    const voices = (raw ? JSON.parse(raw).voices : []) || [];
    ttsSpeakerList.replaceChildren(...voices.map((voice) => {
      const option = document.createElement("option");
      option.value = voice.id;
      option.label = voice.name || voice.id;
      return option;
    }));
  } catch {
    // 音色候选仅为输入提示，加载失败不影响手填。
  }
}

// ── 保存 ──

async function saveConfig() {
  if (!apiKey.value.trim()) {
    setStatus("请填写 Agent Plan API Key", "error");
    return;
  }
  const timeoutValue = Number.parseInt(videoTimeout.value, 10);
  const model = (kind) => modelInputs[kind].value.trim();
  saveBtn.disabled = true;
  setStatus("保存中...", "");
  try {
    const payload = {
      api_key: apiKey.value.trim(),
      image_model: model("image"),
      video_model: model("video"),
      tts_model: model("tts") || DEFAULT_TTS_MODEL,
      asr_model: model("asr") || DEFAULT_ASR_MODEL,
      watermark: watermark.checked,
      video_poll_timeout_secs: Number.isFinite(timeoutValue) ? Math.max(30, timeoutValue) : DEFAULT_VIDEO_TIMEOUT,
      tts_speaker: ttsSpeaker.value.trim() || DEFAULT_TTS_SPEAKER,
    };
    await callHost("save_config", JSON.stringify(payload));
    setStatus("已保存", "success");
    setTimeout(() => setStatus("", ""), 3000);
  } catch (error) {
    setStatus(`保存失败：${errorText(error)}`, "error");
  } finally {
    saveBtn.disabled = false;
  }
}

saveBtn.addEventListener("click", saveConfig);
fillSuggestions();
loadConfig();
loadVoices();
  </script>
</body>
</html>
