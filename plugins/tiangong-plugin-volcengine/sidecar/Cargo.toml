[package]
name = "tiangong-plugin-volcengine-sidecar"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Volcengine 独立 sidecar（Agent Plan：图片/视频生成、语音合成/识别、本机录音播放、配置持久化）"
publish = false

[[bin]]
name = "tiangong-volcengine-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-volcengine-protocol = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
tiangong-media-archive = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls"] }
webpki-root-certs = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
scru128 = { workspace = true }
# Agent Plan 流式语音识别：WebSocket 二进制帧协议，载荷 gzip 压缩。
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
futures-util = { workspace = true, features = ["sink"] }
flate2 = "1"
# 原生录音：跨平台麦克风采集（CoreAudio/WASAPI/ALSA）与 WAV 落盘。
cpal = { workspace = true }
hound = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
