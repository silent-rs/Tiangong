[package]
name = "tiangong-app"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[dependencies]
# 引用核心库 crate
tiangong-core = { workspace = true }
tiangong-core-manager = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-app-state = { workspace = true }
tiangong-media-archive = { workspace = true }
tiangong-types = { workspace = true }
tiangong-bots = { workspace = true }
tiangong-cli = { workspace = true }
tiangong-entry = { workspace = true }
tiangong-server = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-config = { workspace = true }
silent = { workspace = true, features = ["scheduler"] }
async-trait = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
base64 = { workspace = true }
base64-url = "2"
psl = "2"
chrono = { workspace = true, default-features = false, features = ["std", "clock"] }
scru128 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-openai = { workspace = true, features = ["byot", "chat-completion", "model"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "io-util", "sync", "signal", "net"] }
tracing = { workspace = true }
rmcp = { workspace = true, default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
futures-util = { workspace = true }
# 浏览器配置页：读取请求体（与 silent 同版本）
http-body-util = { workspace = true }
http = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls"] }
# 浏览器配置页（`tiangong config` / CLI `/config`）：调用系统默认浏览器打开
open = "5"
# 远程访问：经中继（tiangong-relay）向手机 H5 提供对话侧能力
tiangong-relay = { workspace = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-root-certs = "1"
# 叠加系统信任的根证书（自签/企业 CA、本地 mkcert），已在依赖树中（Apache-2.0 OR ISC OR MIT）
rustls-native-certs = "0.8"
sha2 = { workspace = true }
# 远程访问：长会话等大结果 gzip 压缩后再经中继传输（已在依赖树中）
flate2 = "1"
subtle = { workspace = true }
getrandom = { workspace = true }
# 局域网直连：枚举网卡以探测手机可访问的局域网地址（MIT OR BSD-3-Clause）
if-addrs = "0.15"

# Tauri 相关依赖
tauri = { workspace = true, features = ["protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-shell = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-updater = { workspace = true }

# 后台悬停监听（inactive_hover）：原生窗口/视图坐标转换
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "NSView", "NSWindow"] }
objc2 = "0.6"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serial_test = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[features]
default = []
cli = []
llm-debug-log = ["tiangong-core/llm-debug-log"]
