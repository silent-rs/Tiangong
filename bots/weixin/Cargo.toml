[package]
name = "tiangong-bot-weixin"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "天工微信 bot 制品——基于腾讯 iLink 协议长轮询接收微信消息并转发到天工"

# 独立编译，不进主 workspace（避免主二进制引入 iLink 协议依赖）
[workspace]

[[bin]]
name = "tiangong-bot-weixin"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
rand = "0.8"
scru128 = "4"
hex = "0.4"
md5 = "0.8"
fs2 = "0.4"
rmcp = { version = "2", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
sha2 = "0.10"
# iLink 媒体加解密使用 AES-128-ECB
aes = "0.8"
ecb = "0.1"
cipher = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
