[package]
name = "tiangong-bot-feishu"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "天工飞书 bot 制品——WebSocket 长连接接收飞书消息并转发到天工"

# 独立编译，不进主 workspace（避免主二进制引入 openlark）
[workspace]

[[bin]]
name = "tiangong-bot-feishu"
path = "src/main.rs"

[dependencies]
openlark = { version = "0.18", default-features = false, features = ["auth", "communication", "websocket"] }
openlark-client = { version = "0.18", default-features = false, features = ["websocket"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
fs2 = "0.4"
rmcp = { version = "2", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
scru128 = "4"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
