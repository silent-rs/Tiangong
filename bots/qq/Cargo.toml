[package]
name = "tiangong-bot-qq"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "天工 QQ bot 制品——通过 QQ 开放平台 WebSocket 网关接收 QQ 消息并转发到天工"

# 独立编译，不进主 workspace（避免主二进制引入 QQ 协议依赖）
[workspace]

[[bin]]
name = "tiangong-bot-qq"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
url = "2"
futures-util = "0.3"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
fs2 = "0.4"
rmcp = { version = "2", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
scru128 = "4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
