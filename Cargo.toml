anyhow = "1"
arc-swap = "1"
async-channel = "2"
async-lock = "3"
async-openai = "0.41"
async-trait = "0.1"
backoff = "0.4"
base64 = "0.23"
chrono = { version = "0.4", default-features = false }
clap = "4"
crossterm = "0.29"
cron = "0.17"
dashmap = "6"
diffy = "0.5"
dirs = "6"
dunce = "1"
eventsource-stream = "0.2"
# 本地 Embedding / Rerank 推理（ONNX Runtime）；仅 Memory 使用。
# 链接方式按平台在 plugins/tiangong-plugin-memory/core/Cargo.toml 中选择（Linux 动态加载）。
fastembed = { version = "7.1", default-features = false }
futures-util = "0.3"
fs2 = "0.4"
hex = "0.4"
hmac = "0.13"
http = "1"
http-body-util = "0.1"
jsonschema = { version = "0.50", default-features = false }
libc = "0.2"
minisign-verify = "0.2"
sysinfo = "0.39"
lancedb = "0.37"
notify = "8"
qrcode = "0.14"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "3", default-features = false }
rusqlite = "0.40"
scraper = "0.27"
scru128 = "4"
semver = "1"
serde = "1"
serde_json = "1"
# 原生音频采集（STT 录音）：跨平台麦克风输入（CoreAudio/WASAPI/ALSA）。
cpal = "0.15"
# WAV 读写：录音落盘（正常收尾保证头部长度完整，无需手工修复）。
hound = "3"
serial_test = "4"
tar = "0.4"
zstd = "0.13"
sha2 = "0.11"
windows-sys = "0.61"
silent = "2"
subtle = "2"
tantivy = "0.26"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tempfile = "3"
termimad = "0.35"
thiserror = "2"
tokio = "1"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
typed-builder = "0.23"
url = "2"
wiremock = "0.6"
wasmtime = { version = "48", default-features = false, features = [
    "cranelift",
    "runtime",
    "component-model",
    "parallel-compilation",
    "pooling-allocator",
    "cache",
] }
wasmtime-wasi = { version = "48", default-features = false }
wit-bindgen = "0.60"
zip = { version = "8", default-features = false }

[patch.crates-io]
wry = { git = "https://github.com/silent-rs/wry.git", rev = "4fb16fa0ca6b4b8fa65edc5d3875d9726429285b" }

[package]
name = "tiangong"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "tiangong"
path = "src/main.rs"

[dependencies]
tiangong-entry = { workspace = true }
tiangong-config = { workspace = true }
anyhow = { workspace = true }
