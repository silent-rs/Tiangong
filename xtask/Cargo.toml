[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "辅助构建任务：插件与桌面附带程序的构建部署"

[dependencies]
tiangong-sandbox-update = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
minisign = "0.9"
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

[[bin]]
name = "xtask"
path = "src/main.rs"
