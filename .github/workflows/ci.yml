name: App CI

on:
  pull_request:
  # 合并到 main 后完整运行一次：只有 main 上的 Rust 缓存能被所有 PR 读取，
  # PR 自身不保存缓存（见 save-if），避免每个 PR 都从零编译、缓存超出配额。
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect App Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.resolve.outputs.frontend }}
      interpreter_e2e: ${{ steps.resolve.outputs.interpreter_e2e }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve affected App crates
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ -n "$PR_BASE" ]]; then
            mapfile -t files < <(git diff --name-only "$PR_BASE...HEAD")
          else
            files=()
          fi

          check_all=false
          fallback_all=false
          scoped_change=false
          frontend=false
          interpreter_e2e=false
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            check_all=true
            frontend=true
            interpreter_e2e=true
          fi

          for file in "${files[@]}"; do
            case "$file" in
              .cargo/*)
                check_all=true
                ;;
              Cargo.toml|Cargo.lock|.github/actions/setup-rust/*)
                fallback_all=true
                ;;
            esac
            case "$file" in
              frontend/*|src/*|src-tauri/*|crates/*|plugins/*|tests/*)
                scoped_change=true
                ;;
            esac
            case "$file" in
              frontend/*)
                frontend=true
                ;;
            esac
            case "$file" in
              plugins/tiangong-plugin-creator/*|xtask/*|.github/workflows/ci.yml|crates/plugin/tiangong-plugin-update/*|crates/plugin/tiangong-plugin-runtime/src/artifacts.rs|crates/plugin/tiangong-plugin-runtime/src/registry/*|crates/plugin/tiangong-plugin-runtime/src/signature.rs|tests/plugin-sidecar-e2e/tests/official_catalog_e2e.rs)
                interpreter_e2e=true
                ;;
            esac
          done

          if [[ "$fallback_all" == "true" && "$scoped_change" != "true" ]]; then
            check_all=true
          fi

          workspace="$(pwd)/"
          metadata="$(cargo metadata --no-deps --format-version 1 --locked)"
          packages="$(
            jq -c --arg workspace "$workspace" '
              [
                .packages[]
                | select(.manifest_path | startswith($workspace))
                | select((.manifest_path | contains("/plugins/")) | not)
                | select((.manifest_path | endswith("/xtask/Cargo.toml")) | not)
                | {
                    name,
                    prefix: (
                      if .manifest_path == ($workspace + "Cargo.toml")
                      then "src/"
                      else (.manifest_path | ltrimstr($workspace) | rtrimstr("Cargo.toml"))
                      end
                    )
                  }
              ]
            ' <<< "$metadata"
          )"

          affected='[]'
          mapfile -t package_rows < <(jq -c '.[]' <<< "$packages")
          for row in "${package_rows[@]}"; do
            name="$(jq -r '.name' <<< "$row")"
            prefix="$(jq -r '.prefix' <<< "$row")"
            selected="$check_all"
            if [[ "$selected" != "true" ]]; then
              for file in "${files[@]}"; do
                if [[ "$file" == "$prefix"* ]]; then
                  selected=true
                  break
                fi
              done
            fi
            if [[ "$selected" == "true" ]]; then
              affected="$(jq -c --arg name "$name" '. + [$name] | unique' <<< "$affected")"
            fi
          done
          # 宿主与插件对接的 e2e 读取 plugins/ 下的 SDK、官方插件清单与
          # Creator 产物（App 包矩阵排除 plugins/），这些文件变化时单独选中；
          # tests/fixtures/ 由 runtime 测试读取，变化时同时选中 runtime。
          if [[ "$check_all" != "true" ]]; then
            for file in "${files[@]}"; do
              case "$file" in
                tests/fixtures/*)
                  affected="$(jq -c '. + ["tiangong-plugin-runtime", "tiangong-plugin-sidecar-e2e"] | unique' <<< "$affected")"
                  ;;
                plugins/sdk-sidecar/*|plugins/tiangong-plugin-creator/*|plugins/*/plugin.json|plugins/*/assets/*)
                  affected="$(jq -c '. + ["tiangong-plugin-sidecar-e2e"] | unique' <<< "$affected")"
                  ;;
              esac
            done
          fi

          echo "App crates: $affected"
          echo "Frontend: $frontend"
          echo "Interpreter E2E: $interpreter_e2e"
          echo "matrix=$affected" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "interpreter_e2e=$interpreter_e2e" >> "$GITHUB_OUTPUT"

  rust-fmt:
    name: App Rust fmt
    needs: changes
    if: needs.changes.outputs.matrix != '[]' && needs.changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=(-p "$package")
          done < <(jq -r '.[]' <<< "$MATRIX")
          cargo fmt "${packages[@]}" -- --check

  rust-check-windows:
    name: App Rust check (windows)
    needs: changes
    # #[cfg(windows)] 代码在 Linux 上根本不参与编译，其余 Rust 作业全部跑在
    # ubuntu 上，因此 Windows 专有的名称解析错误（私有项跨模块引用、导入被
    # 错误 cfg 限定等）在 App CI 里没有任何防线。#568 引入的 E0433/E0425 就
    # 是这样进入 main 的，直到 #575 才由插件 Sidecar 作业偶然暴露。
    #
    # 这里只做 cargo check（类型检查，不链接、不跑测试），单作业成本约 3-4
    # 分钟；且仅在 runtime 受影响时触发，不拖慢常规改动。
    if: contains(fromJSON(needs.changes.outputs.matrix), 'tiangong-plugin-runtime')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-check-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check plugin runtime on Windows
        run: cargo check -p tiangong-plugin-runtime --all-targets

  rust-clippy:
    name: App Rust clippy
    needs: changes
    if: needs.changes.outputs.matrix != '[]' && needs.changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup-rust
        with:
          matrix: ${{ needs.changes.outputs.matrix }}
          components: clippy
      - name: Lint crates
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=(-p "$package")
          done < <(jq -r '.[]' <<< "$MATRIX")
          cargo clippy "${packages[@]}" --all-targets --tests --benches -- -D warnings

  rust-test:
    name: App Rust nextest
    needs: changes
    if: needs.changes.outputs.matrix != '[]' && needs.changes.outputs.matrix != ''
    # Plugin Runtime 测试会真实启动 bubblewrap；24.04 Hosted Runner 禁止
    # 所需 uid map，固定到与 Sandbox CI 相同且已验证的 22.04 环境。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup-rust
        with:
          matrix: ${{ needs.changes.outputs.matrix }}
          install-nextest: true
      - name: Prepare plugin runtime sandbox tests
        if: contains(fromJSON(needs.changes.outputs.matrix), 'tiangong-plugin-runtime') || contains(fromJSON(needs.changes.outputs.matrix), 'tiangong-plugin-sidecar-e2e')
        env:
          RUSTFLAGS: "-C linker-features=-lld"
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          test_node="${RUNNER_TEMP}/node"
          cp "$(command -v node)" "$test_node"
          chmod 0755 "$test_node"
          echo "TIANGONG_NODE_PATH=$test_node" >> "$GITHUB_ENV"
          cargo build -p tiangong-sandbox --bin tiangong-sandbox \
            -p tiangong-plugin-command-sidecar --bin tiangong-command-sidecar \
            -p tiangong-plugin-sidecar-e2e --bin test-stdio-host
      - name: Test crates
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
          RUSTFLAGS: "-C linker-features=-lld"
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=(-p "$package")
          done < <(jq -r '.[]' <<< "$MATRIX")
          cargo nextest run "${packages[@]}" --no-tests pass

  # 官方解释器发布链端到端（相关发布链变更时运行）：Fresh Checkout 完整构建
  # plugin-creator（yarn build + xtask 组装 + 测试密钥签名 + 确定性归档 +
  # any 目录片段），随后经本地 http 目录服务真实走 目录发现 → 下载 → 解包 →
  # 官方验签（内容清单全树校验）→ 安装 → sidecar 调用 → 卸载。
  interpreter-release-e2e:
    name: Interpreter Release E2E
    needs: changes
    if: needs.changes.outputs.interpreter_e2e == 'true'
    # 真实 Sidecar 调用经 bubblewrap；与 Sandbox Linux 原生验收环境保持一致。
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler bubblewrap

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: interpreter-release-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Build official interpreter release with test key
        run: |
          key_path="${RUNNER_TEMP}/plugin-test.key"
          cargo run -p xtask -- generate-plugin-test-key "$key_path"
          test -f "${key_path}.pub"
          export TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY_PATH="$key_path"
          # Hosted Node 位于共享 toolcache，权限形态不满足 Launcher 的目标程序
          # 门禁。复制到本次 job 私有目录并收紧权限后显式指定解释器。
          test_node="${RUNNER_TEMP}/node"
          cp "$(command -v node)" "$test_node"
          chmod 0755 "$test_node"
          export TIANGONG_NODE_PATH="$test_node"
          echo "TIANGONG_NODE_PATH=$test_node" >> "$GITHUB_ENV"
          cargo build -p tiangong-sandbox --bin tiangong-sandbox
          cargo run -p xtask -- build-plugin plugin-creator
          version="$(jq -er '.version' plugins/tiangong-plugin-creator/plugin.json)"
          # 断言发布产物齐备（测试必跑的先决条件）。
          test -f target/plugin-dist/plugins-index/fragments/plugin-creator-any.json
          test -f "target/plugin-dist/plugins/plugin-creator/${version}/plugin-creator-${version}.tar.zst"
          test -f "target/plugin-dist/plugins/plugin-creator/${version}/release.json.sig"

      - name: Run catalog install e2e
        env:
          TIANGONG_PLUGIN_E2E_DIST: ${{ github.workspace }}/target/plugin-dist
          # fail-closed：前置产物缺失时测试直接失败，不产生假绿灯。
          # 官方信任根不可配置：测试密钥冒充官方必须被拒，三方链路经
          # 测试存储的信任登记表导入公钥（不经环境变量）。
          TIANGONG_PLUGIN_E2E_REQUIRED: "1"
        run: >
          cargo test -p tiangong-plugin-sidecar-e2e --test official_catalog_e2e
          -- --nocapture

  tauri:
    name: Tauri Shell Check
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.matrix), 'tiangong-app')
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            pkg-config \
            libasound2-dev \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Tauri shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

  frontend:
    name: App Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile
      - name: Run frontend tests
        run: yarn --cwd frontend test
      - name: Build frontend
        run: yarn --cwd frontend build
