name: Publish Official Plugin to OSS

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: "插件 ID（以 plugin.json 的 id 为准）"
        required: true
        type: string
  push:
    tags:
      - "plugin/*/v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TIANGONG_PLUGIN_OSS_BASE_URL: https://silent-tiangong.oss-cn-hangzhou.aliyuncs.com

jobs:
  resolve-plugin:
    name: Resolve plugin
    runs-on: ubuntu-22.04
    outputs:
      plugin_id: ${{ steps.plugin.outputs.plugin_id }}
      plugin_root: ${{ steps.plugin.outputs.plugin_root }}
      has_wasm: ${{ steps.plugin.outputs.has_wasm }}
      has_ui: ${{ steps.plugin.outputs.has_ui }}
      release_kind: ${{ steps.plugin.outputs.release_kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve plugin ID
        id: plugin
        env:
          INPUT_PLUGIN_ID: ${{ inputs.plugin_id }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            plugin_id="${GITHUB_REF_NAME#plugin/}"
            plugin_id="${plugin_id%/v*}"
          else
            plugin_id="$INPUT_PLUGIN_ID"
          fi
          if [[ -z "$plugin_id" || "$plugin_id" == */* || "$plugin_id" == *..* ]]; then
            echo "Invalid plugin ID: $plugin_id"
            exit 1
          fi
          echo "plugin_id=$plugin_id" >> "$GITHUB_OUTPUT"
          # 从 plugin.json 解析插件形态：纯 UI 插件（如 interaction/browser）
          # 无 wasm；带 UI 贡献的插件需要预构建单文件页面；解释器 sidecar
          # 插件（node/python）为平台无关发布（单一 any 归档，独立构建任务）。
          python3 - "$plugin_id" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          plugin_id = sys.argv[1]
          for root in (
              f"plugins/tiangong-plugin-{plugin_id}",
              f"plugins/tiangong-{plugin_id}",
              f"plugins/{plugin_id}",
          ):
              if os.path.isfile(f"{root}/plugin.json"):
                  manifest = json.load(open(f"{root}/plugin.json"))
                  has_wasm = "true" if manifest.get("wasm") else "false"
                  # has_ui 只表示「需要前端构建链的 UI」：手写自包含单文件
                  # UI（无 package.json，如 coding/computer-use）由 xtask 直接
                  # 从源码复制，不走共享 UI 构建。
                  has_ui = (
                      "true"
                      if manifest.get("ui", {}).get("contributions")
                      and os.path.isfile(f"{root}/package.json")
                      else "false"
                  )
                  runtime = manifest.get("sidecar", {}).get("runtime")
                  release_kind = (
                      "interpreter-sidecar"
                      if runtime and runtime != "native"
                      else "standard"
                  )
                  print(f"plugin_root={root}")
                  print(f"has_wasm={has_wasm}")
                  print(f"has_ui={has_ui}")
                  print(f"release_kind={release_kind}")
                  break
          else:
              raise SystemExit(f"plugin.json not found for {plugin_id}")
          PY

  build-wasm:
    name: Build shared WASM
    needs: resolve-plugin
    if: needs.resolve-plugin.outputs.has_wasm == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Build deterministic shared WASM
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
        run: cargo run -p xtask -- build-plugin-wasm "$PLUGIN_ID" "target/shared-wasm/${PLUGIN_ID}.wasm"
      - name: Upload shared WASM
        uses: actions/upload-artifact@v4
        with:
          name: plugin-wasm-${{ needs.resolve-plugin.outputs.plugin_id }}
          path: target/shared-wasm/${{ needs.resolve-plugin.outputs.plugin_id }}.wasm
          if-no-files-found: error
          retention-days: 7

  build-ui:
    name: Build shared UI
    needs: resolve-plugin
    # 解释器插件的 UI 与 sidecar bundle 由 build-interpreter 一次性完整构建，
    # 不走共享 UI 通道（Fresh Checkout 需要完整产物，不只 dist/index.html）。
    if: needs.resolve-plugin.outputs.has_ui == 'true' && needs.resolve-plugin.outputs.release_kind != 'interpreter-sidecar'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build deterministic shared UI
        env:
          PLUGIN_ROOT: ${{ needs.resolve-plugin.outputs.plugin_root }}
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --cwd "$PLUGIN_ROOT" install --frozen-lockfile
          yarn --cwd "$PLUGIN_ROOT" build
          mkdir -p target/shared-ui/dist
          cp "$PLUGIN_ROOT/dist/index.html" target/shared-ui/dist/index.html
      - name: Upload shared UI
        uses: actions/upload-artifact@v4
        with:
          name: plugin-ui-${{ needs.resolve-plugin.outputs.plugin_id }}
          path: target/shared-ui/
          if-no-files-found: error
          retention-days: 7
  build-plugin:
    name: Build ${{ needs.resolve-plugin.outputs.plugin_id }} (${{ matrix.plugin_platform }})
    needs: [resolve-plugin, build-wasm, build-ui]
    # 纯 UI 插件会跳过 build-wasm；显式判定 needs 结果，避免
    # skipped 状态传播导致整条发布链被跳过。解释器插件走 build-interpreter。
    if: ${{ !cancelled() && needs.resolve-plugin.result == 'success' && needs.resolve-plugin.outputs.release_kind != 'interpreter-sidecar' && needs.build-wasm.result != 'failure' && needs.build-ui.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            plugin_platform: darwin-aarch64
          - runner: ubuntu-22.04
            plugin_platform: linux-x86_64
          - runner: windows-latest
            plugin_platform: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install Tauri signer
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install protoc on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libasound2-dev pkg-config

      - name: Install protoc on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          # Chocolatey can report success after a feed error; verify the executable.
          for attempt in 1 2 3; do
            if ! choco install protoc -y --no-progress; then
              echo "::warning::protoc installation failed (attempt ${attempt}/3)"
            fi
            protoc_path="$(command -v protoc || true)"
            if [[ -z "$protoc_path" ]]; then
              # A newly installed package may not be on this shell's PATH yet.
              choco_root="$(cygpath -u "${ChocolateyInstall:-C:\ProgramData\chocolatey}")"
              if [[ -f "$choco_root/bin/protoc.exe" ]]; then
                protoc_path="$choco_root/bin/protoc.exe"
              fi
            fi
            if [[ -n "$protoc_path" ]] && "$protoc_path" --version; then
              # Give native build scripts an absolute Windows path, independent of PATH.
              printf 'PROTOC=%s\n' "$(cygpath -aw "$protoc_path")" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::protoc is unavailable after attempt ${attempt}/3"
            if [[ "$attempt" -lt 3 ]]; then
              sleep 10
            fi
          done
          echo "::error::protoc installation could not be verified after 3 attempts"
          exit 1

      # memory sidecar 通过 bundled-sqlcipher-vendored-openssl 由 openssl-sys 从源码
      # 静态编译 SQLCipher 与 OpenSSL 并链接进 sidecar.exe，产物自包含，运行时不再
      # 依赖 libcrypto-3-x64.dll。因此 Windows 下既不需要配置系统 OpenSSL 路径，更不能
      # 设置 OPENSSL_NO_VENDOR=1——那会让 openssl-sys 改用系统动态库，导致用户机器缺 DLL。
      # 注意：vendored 编译需要完整 Perl 驱动 OpenSSL 的 Configure；windows-latest 虽预装
      # Strawberry Perl，但 Git Bash 每个 step 会重排 PATH，使自带的精简 MSYS2 Perl 优先（缺
      # Locale::Maketext::Simple 等模块，OpenSSL Configure 启动即失败）。$GITHUB_PATH 在 Git Bash
      # 下无法可靠地让 Strawberry 优先，因此必须在执行构建的同一 shell 内前置——见下方
      # Build and sign plugin 步骤。
      - name: Download shared WASM
        if: needs.resolve-plugin.outputs.has_wasm == 'true'
        uses: actions/download-artifact@v4
        with:
          name: plugin-wasm-${{ needs.resolve-plugin.outputs.plugin_id }}
          path: target/shared-wasm
      - name: Download shared UI
        if: needs.resolve-plugin.outputs.has_ui == 'true'
        uses: actions/download-artifact@v4
        with:
          name: plugin-ui-${{ needs.resolve-plugin.outputs.plugin_id }}
          path: target/shared-ui
      - name: Validate plugin from repository configuration
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
        run: cargo run -p xtask -- validate-plugin "$PLUGIN_ID"

      - name: Test cross-platform file handling
        if: needs.resolve-plugin.outputs.plugin_id == 'fs'
        timeout-minutes: 10
        run: cargo test -p tiangong-plugin-fs-sidecar -p tiangong-media-archive

      - name: Prepare plugin signing key
        id: plugin_signing
        env:
          PLUGIN_SIGNING_PRIVATE_KEY: ${{ secrets.TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$PLUGIN_SIGNING_PRIVATE_KEY" ]]; then
            echo "TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY is required."
            exit 1
          fi
          key_path="$RUNNER_TEMP/tiangong-plugin-signing.key"
          printf '%s' "$PLUGIN_SIGNING_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Build and sign plugin
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
          TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY_PATH: ${{ steps.plugin_signing.outputs.key_path }}
          TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY_PASSWORD }}
          TIANGONG_PLUGIN_PREBUILT_WASM: ${{ needs.resolve-plugin.outputs.has_wasm == 'true' && format('{0}/target/shared-wasm/{1}.wasm', github.workspace, needs.resolve-plugin.outputs.plugin_id) || '' }}
          TIANGONG_PLUGIN_PREBUILT_UI: ${{ needs.resolve-plugin.outputs.has_ui == 'true' && format('{0}/target/shared-ui/dist/index.html', github.workspace) || '' }}
        run: |
          if [[ "$(uname -s)" == MINGW* ]]; then
            # Git Bash 每个 step 会重排 PATH，使 MSYS2 自带 perl 优先于 Strawberry；
            # 必须在执行 cargo 的同一 shell 内前置，openssl-src 的 build script（作为 cargo
            # 子进程）才会用到 Strawberry Perl。先自检所需模块，路径有误时秒级失败。
            export PATH="/c/Strawberry/perl/bin:$PATH"
            perl -e 'use Locale::Maketext::Simple; print "perl OK: $^X\n"'
          fi
          cargo run -p xtask -- build-plugin "$PLUGIN_ID"

      - name: Verify official signature (key must match built-in pubkey)
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
          EXPECTED_PLATFORM: ${{ matrix.plugin_platform }}
        run: |
          pattern="target/plugin-dist/plugins/${PLUGIN_ID}"/*/"${EXPECTED_PLATFORM}/release.json"
          if compgen -G "$pattern" > /dev/null; then
            release_json="$(compgen -G "$pattern")"
            cargo run -p xtask -- verify-official-release "$release_json"
          fi

      - name: Verify platform output
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
          EXPECTED_PLATFORM: ${{ matrix.plugin_platform }}
        run: |
          fragment="target/plugin-dist/plugins-index/fragments/${PLUGIN_ID}-${EXPECTED_PLATFORM}.json"
          test -f "$fragment"
          # release.json / release.json.sig 仅对 sidecar 插件生成；
          # 纯 WASM 插件不产出签名清单，只要求 fragment 存在。
          if compgen -G "target/plugin-dist/plugins/${PLUGIN_ID}/*/${EXPECTED_PLATFORM}/release.json" > /dev/null; then
            test -f "target/plugin-dist/plugins/${PLUGIN_ID}"/*/"${EXPECTED_PLATFORM}/release.json.sig"
          fi

      - name: Remove plugin signing key
        if: always() && steps.plugin_signing.outputs.key_path != ''
        env:
          PLUGIN_SIGNING_KEY_PATH: ${{ steps.plugin_signing.outputs.key_path }}
        run: rm -f "$PLUGIN_SIGNING_KEY_PATH"

      - name: Upload platform plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dist-${{ needs.resolve-plugin.outputs.plugin_id }}-${{ matrix.plugin_platform }}
          path: |
            target/plugin-dist/plugins/${{ needs.resolve-plugin.outputs.plugin_id }}/
            target/plugin-dist/plugins-index/fragments/${{ needs.resolve-plugin.outputs.plugin_id }}-${{ matrix.plugin_platform }}.json
          if-no-files-found: error
          retention-days: 7

  build-interpreter:
    name: Build interpreter plugin (${{ needs.resolve-plugin.outputs.plugin_id }})
    needs: [resolve-plugin, build-wasm, build-ui]
    # 解释器 sidecar 插件：平台无关（any）发布形态，单一 ubuntu 任务完整
    # 构建（UI + sidecar bundle + 归档 + 签名），不启动三平台矩阵。
    if: ${{ !cancelled() && needs.resolve-plugin.result == 'success' && needs.resolve-plugin.outputs.release_kind == 'interpreter-sidecar' && needs.build-wasm.result != 'failure' && needs.build-ui.result != 'failure' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Validate plugin from repository configuration
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
        run: cargo run -p xtask -- validate-plugin "$PLUGIN_ID"

      - name: Prepare plugin signing key
        id: plugin_signing
        env:
          PLUGIN_SIGNING_PRIVATE_KEY: ${{ secrets.TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$PLUGIN_SIGNING_PRIVATE_KEY" ]]; then
            echo "TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY is required."
            exit 1
          fi
          key_path="$RUNNER_TEMP/tiangong-plugin-signing.key"
          printf '%s' "$PLUGIN_SIGNING_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      # Fresh Checkout 完整构建：xtask 内部执行 yarn install + yarn build
      # （同时产出 dist/index.html 与 build/sidecar-main.mjs），随后组装
      # release、生成内容清单、签名与平台无关归档。
      - name: Build and sign plugin
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
          TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY_PATH: ${{ steps.plugin_signing.outputs.key_path }}
          TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo run -p xtask -- build-plugin "$PLUGIN_ID"

      - name: Verify official signature (key must match built-in pubkey)
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
        run: |
          pattern="target/plugin-dist/plugins/${PLUGIN_ID}"/*/release.json
          if compgen -G "$pattern" > /dev/null; then
            release_json="$(compgen -G "$pattern")"
            cargo run -p xtask -- verify-official-release "$release_json"
          else
            echo "missing release.json for ${PLUGIN_ID}"
            exit 1
          fi

      - name: Verify interpreter output
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
        run: |
          test -f "target/plugin-dist/plugins-index/fragments/${PLUGIN_ID}-any.json"
          # 解释器分发的 release_root 无平台子目录：plugins/<id>/<version>/release.json。
          test -f "target/plugin-dist/plugins/${PLUGIN_ID}"/*/release.json
          test -f "target/plugin-dist/plugins/${PLUGIN_ID}"/*/release.json.sig
          archive="$(compgen -G "target/plugin-dist/plugins/${PLUGIN_ID}"/*"/${PLUGIN_ID}-"*.tar.zst)"
          test -n "$archive" && test -f "$archive"

      - name: Remove plugin signing key
        if: always() && steps.plugin_signing.outputs.key_path != ''
        env:
          PLUGIN_SIGNING_KEY_PATH: ${{ steps.plugin_signing.outputs.key_path }}
        run: rm -f "$PLUGIN_SIGNING_KEY_PATH"

      - name: Upload interpreter plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dist-${{ needs.resolve-plugin.outputs.plugin_id }}-any
          path: |
            target/plugin-dist/plugins/${{ needs.resolve-plugin.outputs.plugin_id }}/
            target/plugin-dist/plugins-index/fragments/${{ needs.resolve-plugin.outputs.plugin_id }}-any.json
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    name: Prepare independent plugin release
    needs: [resolve-plugin, build-plugin, build-interpreter]
    # skipped 沿依赖图传播：上游构建任务被形态跳过后，下游也必须显式判定
    # 结果（build-plugin 与 build-interpreter 互斥执行，任一成功即可）。
    if: ${{ !cancelled() && needs.resolve-plugin.result == 'success' && (needs.build-plugin.result == 'success' || needs.build-interpreter.result == 'success') }}
    runs-on: ubuntu-22.04
    outputs:
      plugin_id: ${{ needs.resolve-plugin.outputs.plugin_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-dist-${{ needs.resolve-plugin.outputs.plugin_id }}-*
          path: target/plugin-platforms

      - name: Merge and validate selected plugin
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
          RELEASE_KIND: ${{ needs.resolve-plugin.outputs.release_kind }}
        run: |
          # 解释器插件期望单一平台无关片段（any，签名数量 1）；
          # 原生 sidecar 插件期望三平台完整（签名数量 3）。
          if [[ "$RELEASE_KIND" == "interpreter-sidecar" ]]; then
            export TIANGONG_PLUGIN_EXPECTED_PLATFORMS=any
            expected_signatures=1
          else
            export TIANGONG_PLUGIN_EXPECTED_PLATFORMS=darwin-aarch64,linux-x86_64,windows-x86_64
            expected_signatures=3
          fi
          cargo run -p xtask -- merge-plugin-dist "$PLUGIN_ID" target/plugin-platforms target/plugin-release
          # 纯 WASM 插件不生成 release.json/sig，只在有签名清单时验证数量。
          release_count=$(find target/plugin-release/plugins -name release.json | wc -l | tr -d ' ')
          if [ "$release_count" -gt 0 ]; then
            test "$release_count" = "$expected_signatures"
            test "$(find target/plugin-release/plugins -name release.json.sig | wc -l | tr -d ' ')" = "$expected_signatures"
          fi

      - name: Upload independent release artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-release-${{ needs.resolve-plugin.outputs.plugin_id }}
          path: target/plugin-release/
          if-no-files-found: error
          retention-days: 30

  publish-plugin:
    name: Publish independent plugin
    needs: [resolve-plugin, prepare-release]
    if: ${{ !cancelled() && needs.prepare-release.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: plugin-oss-catalog-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download independent release artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-release-${{ needs.resolve-plugin.outputs.plugin_id }}
          path: target/plugin-release

      - name: Install ossutil
        run: |
          curl --connect-timeout 10 --max-time 120 --retry 3 --retry-all-errors -fsSL \
            https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip \
            -o /tmp/ossutil.zip
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil
          sudo cp /tmp/ossutil/ossutil-v1.7.18-linux-amd64/ossutil /usr/local/bin/ossutil

      - name: Configure ossutil
        run: |
          ossutil config \
            -e oss-cn-hangzhou.aliyuncs.com \
            -i "${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}" \
            -k "${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}"

      - name: Download current catalog
        run: |
          curl --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors -fsSL \
            "${TIANGONG_PLUGIN_OSS_BASE_URL}/plugins-index/catalog.json?run=${GITHUB_RUN_ID}" \
            -o target/current-catalog.json

      - name: Merge selected plugin into catalog
        run: |
          cargo run -p xtask -- merge-plugin-catalog \
            target/current-catalog.json \
            target/plugin-release/plugins-index/catalog.json \
            target/plugin-release/plugins-index/catalog.merged.json

      - name: Upload immutable selected plugin version
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
        run: |
          ossutil cp -r "target/plugin-release/plugins/${PLUGIN_ID}/" "oss://silent-tiangong/plugins/${PLUGIN_ID}/" -f
          ossutil cp "target/plugin-release/plugins-index/catalog.json" \
            "oss://silent-tiangong/plugins-index/releases/${PLUGIN_ID}.json" -f

      - name: Publish aggregate catalog last
        run: |
          catalog=target/plugin-release/plugins-index/catalog.merged.json
          timeout 5m ossutil cp target/current-catalog.json \
            oss://silent-tiangong/plugins-index/catalog.json.previous -f
          ossutil cp "$catalog" oss://silent-tiangong/plugins-index/catalog.json.next -f
          ossutil cp "$catalog" oss://silent-tiangong/plugins-index/catalog.json -f

      - name: Verify published catalog
        run: |
          rollback_catalog() {
            echo "Catalog verification failed; restoring previous catalog."
            timeout 5m ossutil cp target/current-catalog.json \
              oss://silent-tiangong/plugins-index/catalog.json -f
            curl --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors -fsSL \
              "${TIANGONG_PLUGIN_OSS_BASE_URL}/plugins-index/catalog.json?run=${GITHUB_RUN_ID}-rollback" \
              -o /tmp/rolled-back-catalog.json
            rollback_expected="$(sha256sum target/current-catalog.json | awk '{print $1}')"
            rollback_actual="$(sha256sum /tmp/rolled-back-catalog.json | awk '{print $1}')"
            test "$rollback_expected" = "$rollback_actual"
          }

          expected="$(sha256sum target/plugin-release/plugins-index/catalog.merged.json | awk '{print $1}')"
          if ! curl --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors -fsSL \
            "${TIANGONG_PLUGIN_OSS_BASE_URL}/plugins-index/catalog.json?run=${GITHUB_RUN_ID}-verify" \
            -o /tmp/published-catalog.json; then
            rollback_catalog
            exit 1
          fi
          if ! cargo run -p xtask -- validate-plugin-catalog /tmp/published-catalog.json; then
            rollback_catalog
            exit 1
          fi
          actual="$(sha256sum /tmp/published-catalog.json | awk '{print $1}')"
          if [[ "$expected" != "$actual" ]]; then
            echo "Published catalog checksum mismatch: expected=${expected}, actual=${actual}"
            rollback_catalog
            exit 1
          fi
