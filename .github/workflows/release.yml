name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，留空时使用 v0.16.15"
        required: false
        type: string
      release_draft:
        description: "创建草稿 Release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  publish-tauri:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: Linux
            platform: ubuntu-22.04
            rust_targets: ""
            args: ""
          - label: Windows
            platform: windows-latest
            rust_targets: ""
            args: "--bundles nsis"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release options
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            draft="false"
          else
            tag="${{ inputs.tag }}"
            if [[ -z "$tag" ]]; then
              tag="v0.16.15"
            fi
            draft="${{ inputs.release_draft }}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --force --tags

          current_ref="$GITHUB_SHA"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            current_ref="$RELEASE_TAG"
          fi

          previous_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -Fvx "$RELEASE_TAG" | head -n 1 || true)"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$current_ref"
          else
            range="$current_ref"
          fi

          subjects_file="$RUNNER_TEMP/release-subjects.txt"
          notes_file="$RUNNER_TEMP/release-notes.md"
          git log --no-merges --format='%s' "$range" | awk '!seen[$0]++' > "$subjects_file" || true

          {
            echo "天工 ${RELEASE_TAG} 更新"
            echo
          } > "$notes_file"

          write_section() {
            local title="$1"
            local pattern="$2"
            local matches
            matches="$(grep -E "$pattern" "$subjects_file" | grep -Ev '^chore\(release\):' || true)"
            if [[ -n "$matches" ]]; then
              echo "### $title" >> "$notes_file"
              printf '%s\n' "$matches" \
                | sed -E 's/^[a-z]+(\([^)]+\))?!?:[[:space:]]*/- /' \
                >> "$notes_file"
              echo >> "$notes_file"
            fi
          }

          write_section "新功能" '^feat(\([^)]+\))?!?:'
          write_section "修复" '^fix(\([^)]+\))?!?:'
          write_section "性能优化" '^perf(\([^)]+\))?!?:'
          write_section "文档" '^docs?(\([^)]+\))?!?:'
          write_section "重构" '^refactor(\([^)]+\))?!?:'
          write_section "工程与发布" '^(ci|build|chore)(\([^)]+\))?!?:'
          write_section "测试" '^test(\([^)]+\))?!?:'

          other_changes="$(
            grep -Ev '^(feat|fix|perf|docs?|refactor|style|test|ci|build|chore)(\([^)]+\))?!?:' "$subjects_file" \
              | grep -Ev '^chore\(release\):' || true
          )"
          if [[ -n "$other_changes" ]]; then
            echo "### 其他调整" >> "$notes_file"
            printf '%s\n' "$other_changes" | sed -E 's/^/- /' >> "$notes_file"
            echo >> "$notes_file"
          fi

          if ! grep -q '^- ' "$notes_file"; then
            {
              echo "### 本次更新"
              echo "- 维护更新与稳定性改进"
              echo
            } >> "$notes_file"
          fi

          {
            echo "---"
            echo
            echo "当前 Release 包含 macOS Apple Silicon、Windows 和 Linux 安装产物，并上传应用内更新所需的 latest.json 与签名文件。macOS 安装包已使用 Developer ID 签名并通过 Apple 公证。"
          } >> "$notes_file"

          {
            echo "body<<RELEASE_BODY"
            cat "$notes_file"
            echo "RELEASE_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install protoc on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc on Windows
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Verify updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required to build updater artifacts."
            exit 1
          fi

      # Developer ID 签名与公证凭据：缺任何一项都直接失败，避免发出未签名的正式包。
      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            KEYCHAIN_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::缺少 macOS 签名/公证 secrets：${missing[*]}"
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # tauri-action 默认安装最新 @tauri-apps/cli（2.12.0 起 NSIS 打包存在上游回归：
      # installer.nsi 引用的 RestartManager 宏在 nsis_tauri_utils-v0.5.3 中缺失），
      # 固定到最后一个验证可用的版本，并通过 tauriScript 让 action 使用该版本。
      - name: Install pinned Tauri CLI
        run: npm install -g @tauri-apps/cli@2.11.5

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 仅 macOS 注入 Apple 凭据；Tauri 检测到后自动导入证书、签名并公证
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          KEYCHAIN_PASSWORD: ${{ runner.os == 'macOS' && secrets.KEYCHAIN_PASSWORD || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
        with:
          projectPath: .
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: "天工 v0.16.15"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: ${{ steps.release.outputs.draft }}
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          assetNamePattern: "Tiangong_[version]_[platform]_[arch][setup][ext]"
          tauriScript: tauri
          args: ${{ matrix.args }}

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        run: |
          # 用 glob 而非 find：步骤以 -e -o pipefail 运行，find 遇到不存在的目录会返回非 0 使步骤静默失败
          shopt -s nullglob
          apps=(target/*/release/bundle/macos/*.app target/release/bundle/macos/*.app)
          if (( ${#apps[@]} == 0 )); then
            echo "::error::未找到 macOS .app 产物"
            exit 1
          fi
          app="${apps[0]}"
          echo "Verifying $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|flags)='
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Remove notarization key
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  upload-to-oss:
    name: Upload to Aliyun OSS
    needs: publish-tauri
    runs-on: ubuntu-22.04
    if: ${{ needs.publish-tauri.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${{ inputs.tag }}"
            if [[ -z "$tag" ]]; then
              tag="v0.16.15"
            fi
          fi
          # Strip leading 'v' or 'app-v' to get bare version
          version="${tag#app-v}"
          version="${version#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p oss-upload
          cd oss-upload

          # Download latest.json
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --pattern "latest.json" --clobber

          # Download all platform installers and signatures
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --pattern "*.dmg" --pattern "*.dmg.sig" \
            --pattern "*.AppImage" --pattern "*.AppImage.sig" \
            --pattern "*-setup.exe" --pattern "*-setup.exe.sig" \
            --clobber || true

      - name: Prepare OSS latest.json
        working-directory: oss-upload
        run: |
          # Replace GitHub download URLs with OSS URLs in latest.json
          sed -i \
            's|https://github.com/${{ github.repository }}/releases/download/|https://silent-tiangong.oss-cn-hangzhou.aliyuncs.com/|g' \
            latest.json

          echo "--- OSS latest.json ---"
          cat latest.json

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip -o /tmp/ossutil.zip
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil
          sudo cp /tmp/ossutil/ossutil-v1.7.18-linux-amd64/ossutil /usr/local/bin/ossutil

      - name: Configure ossutil
        run: |
          ossutil config \
            -e oss-cn-hangzhou.aliyuncs.com \
            -i "${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}" \
            -k "${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}"

      - name: Upload version assets to OSS
        working-directory: oss-upload
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          echo "Uploading version assets to OSS: v${VERSION}/"

          # Upload installers and signatures to versioned path
          for f in *.dmg *.dmg.sig *.AppImage *.AppImage.sig *-setup.exe *-setup.exe.sig; do
            if [[ -f "$f" ]]; then
              echo "  Uploading $f -> v${VERSION}/${f}"
              ossutil cp "$f" "oss://silent-tiangong/v${VERSION}/${f}" -f
            fi
          done

      - name: Upload latest.json to OSS
        working-directory: oss-upload
        run: |
          echo "Uploading latest.json to OSS root"
          ossutil cp latest.json "oss://silent-tiangong/latest.json" -f
