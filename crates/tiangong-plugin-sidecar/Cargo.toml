[package]
name = "tiangong-plugin-sidecar"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "插件 sidecar 通用运行库与宿主/插件共用约定（协议、环境变量、发布约定、IPC server）"
publish = false

[dependencies]
# 模型配置读取（model 模块）：只有需要调用用户模型的插件开启。
tiangong-llm = { workspace = true, optional = true }
tiangong-config = { workspace = true, optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "time", "io-util", "io-std", "net", "sync"] }
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
scru128 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }

[features]
# 读取用户模型配置（models.json）并解析模型端点。
model = ["dep:tiangong-llm", "dep:tiangong-config"]

[dev-dependencies]
serial_test = { workspace = true }
