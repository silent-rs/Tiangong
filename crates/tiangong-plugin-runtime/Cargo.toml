[package]
name = "tiangong-plugin-runtime"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[package.metadata.tiangong]
transport-protocol = "0.1.0"

[dependencies]
tiangong-core = { workspace = true }
tiangong-core-manager = { workspace = true }
tiangong-config = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-types = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
libc = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
futures-util = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
semver = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }
scru128 = { workspace = true }
# Launcher 安装/更新与宿主交互约定（不含平台沙箱实现）。
tiangong-sandbox-update = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
minisign-verify = "0.2"
minisign = "0.9"
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
# AppContainer 内的路径规范化（launch_policy::canonicalize_path）。
dunce = { workspace = true }
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# 仅测试：契约测试校验宿主请求能被 Launcher 按相同语义解析；Windows 探针
# 读取 Job 限额。不进入 App 构建。
tiangong-sandbox = { workspace = true }
serial_test = { workspace = true }
tiangong-plugin-command-protocol = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
