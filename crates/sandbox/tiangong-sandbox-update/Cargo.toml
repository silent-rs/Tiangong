[package]
name = "tiangong-sandbox-update"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Sandbox Launcher 的安装、更新与宿主交互约定（不含平台沙箱实现）"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
scru128 = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
# 更新目录进程级文件锁（串行化检查与升级，异常退出自动释放）。
fs2 = { workspace = true }
minisign-verify = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
semver = { workspace = true }
tiangong-toolkit = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
minisign = "0.9"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
