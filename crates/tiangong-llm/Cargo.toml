[package]
name = "tiangong-llm"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
scru128 = { workspace = true }
tiangong-anthropic = { workspace = true }
tiangong-deepseek = { workspace = true }
tiangong-types = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
async-openai = { workspace = true, features = ["byot", "chat-completion", "model", "responses"] }
eventsource-stream = { workspace = true }
bytes = "1"
backoff = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls"] }
futures-util = { workspace = true }
jsonschema = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
# Codex（ChatGPT 账号）OAuth 登录：PKCE 随机数、S256 摘要、回调参数解析、凭据时间戳
getrandom = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["std", "clock"] }

[dev-dependencies]
wiremock = { workspace = true }
