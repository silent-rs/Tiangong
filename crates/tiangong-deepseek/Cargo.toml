[package]
name = "tiangong-deepseek"
version = "0.1.7"
edition = "2024"
license = "Apache-2.0"
description = "An asynchronous Rust client for the DeepSeek API, supporting chat completions (with SSE streaming), responses, files, web search/fetch, model listing, and balance queries."
repository = "https://github.com/silent-rs/silent-Tiangong"
keywords = ["deepseek", "llm", "ai", "openai", "chat"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
eventsource-stream = "0.2"
bytes = "1"
scru128 = "4"
tokio = { workspace = true, features = ["time"] }
futures-util = "0.3"
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
