[package]
name = "tiangong-deepseek"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "An asynchronous Rust client for the DeepSeek API: chat completions (SSE streaming), responses, files (document parsing), web search/fetch, OCR, ASR, TTS (HTTP & WebSocket streaming), server-side web tools, and safety check."
readme = "README.md"
repository = "https://github.com/silent-rs/silent-Tiangong"
keywords = ["deepseek", "llm", "ai", "openai", "chat"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
eventsource-stream = "0.2"
bytes = "1"
scru128 = "4"
tokio = { workspace = true, features = ["time"] }
futures-util = "0.3"
tracing = { workspace = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls", "rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
