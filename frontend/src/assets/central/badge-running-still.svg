      <g fill="#8b5cf6">
        <circle cx="0" cy="-4.9" r="0.55">
        </circle>
        <circle cx="4.25" cy="2.45" r="0.55">
        </circle>
        <circle cx="-4.25" cy="2.45" r="0.55">
        </circle>
