<svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 中枢角标 · 轨道运转（执行中 · 静态帧，reduced-motion 降级用）：渐变双弧反向旋转 + 内轨刻度 + 核脉冲 -->
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
